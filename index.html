<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        header p {
            color: var(--hint-color);
            font-size: 14px;
        }

        .card {
            background-color: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .card p {
            font-size: 14px;
            color: var(--hint-color);
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--hint-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: 12px;
            color: var(--hint-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="greeting">Привет, гость!</h1>
            <p>Это пример интерфейса для Telegram Mini App</p>
        </header>

        <div class="card">
            <h3>Ввод данных</h3>
            <p>Введите ваш никнейм или заметку:</p>
            <input type="text" id="userInput" placeholder="Например, Александр">
        </div>

        <div class="card">
            <h3>Статус подключения</h3>
            <p id="platformInfo">Определение платформы...</p>
        </div>

        <button class="btn" id="mainButton">Нажми на меня</button>

        <footer>
            Telegram Mini App Template &copy; 2026
        </footer>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Сообщаем Telegram, что приложение готово к отображению
        tg.ready();
        
        // Разворачиваем на полный экран (по желанию)
        tg.expand();

        // Персонализация приветствия, если приложение открыто реальным пользователем в Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
            document.getElementById('platformInfo').innerText = `Платформа: Telegram (${tg.platform})`;
        } else {
            document.getElementById('platformInfo').innerText = 'Запущено в обычном браузере';
        }

        // Обработка нажатия на кнопку
        const button = document.getElementById('mainButton');
        const input = document.getElementById('userInput');

        button.addEventListener('click', () => {
            const text = input.value.trim();
            if (text) {
                alert(`Спасибо, ${text}! Данные успешно приняты.`);
            } else {
                alert('Пожалуйста, заполните поле ввода.');
            }
        });
    </script>
</body>
</html>
